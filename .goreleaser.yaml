version: 2

project_name: traefik-envoy-ratelimit

builds:
- skip: true

checksum:
  name_template: 'checksums.txt'

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source_code"

changelog:
  use: github-native

sboms:
- id: source
  artifacts: source
  documents:
  - "{{ .ProjectName }}_{{ .Version }}_sbom.spdx.json"

signs:
- cmd: cosign
  signature: "${artifact}.sigstore.json"
  args:
  - sign-blob
  - "--bundle=${signature}"
  - --yes
  - "${artifact}"
  artifacts: checksum
  output: true
